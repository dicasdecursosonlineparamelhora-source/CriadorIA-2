<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Criador IA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}

header {
  background: #111827;
  padding: 18px;
  text-align: center;
  border-bottom: 1px solid #263149;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 7px 0 0;
  color: #aeb8cc;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #111827;
  border: 1px solid #263149;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea,
select,
input[type="text"] {
  width: 100%;
  border: 1px solid #34415d;
  background: #0b1020;
  color: white;
  border-radius: 12px;
  padding: 13px;
  font-size: 16px;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
}

.primary {
  background: #2563eb;
  color: white;
}

.success {
  background: #16a34a;
  color: white;
}

.danger {
  background: #dc2626;
  color: white;
}

.secondary {
  background: #374151;
  color: white;
}

.file-button {
  display: block;
  background: #374151;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  margin-top: 10px;
}

.file-button input {
  display: none;
}

#filePreview {
  margin-top: 15px;
}

.preview-box {
  background: #0b1020;
  border: 1px solid #34415d;
  border-radius: 12px;
  padding: 12px;
}

.preview-box img,
.preview-box video,
.preview-box audio {
  max-width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}

.status {
  padding: 12px;
  border-radius: 10px;
  background: #172033;
  color: #cbd5e1;
  margin-top: 12px;
}

.result {
  margin-top: 15px;
}

.result img,
.result video,
.result audio {
  width: 100%;
  max-height: 650px;
  object-fit: contain;
  border-radius: 12px;
  background: black;
}

.result-text {
  white-space: pre-wrap;
  background: #0b1020;
  border-radius: 12px;
  padding: 16px;
  line-height: 1.6;
}

.small {
  color: #94a3b8;
  font-size: 13px;
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}

.hidden {
  display: none;
}

.loading {
  text-align: center;
  padding: 25px;
}

.spinner {
  width: 35px;
  height: 35px;
  border: 4px solid #334155;
  border-top-color: #60a5fa;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: auto;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
</style>
</head>

<body>

<header>
  <h1>🤖 Criador IA</h1>
  <p>Crie textos, imagens, vídeos e áudios com IA</p>
</header>

<div class="container">

  <!-- CONEXÃO -->
  <div class="card">
    <h2>🔐 Conta</h2>

    <div id="loginArea">
      <p class="small">
        Conecte sua conta Pollinations para usar a IA.
      </p>

      <button class="primary" onclick="login()">
        🔑 Conectar com Pollinations
      </button>
    </div>

    <div id="connectedArea" class="hidden">
      <p id="userStatus">✅ Conectado</p>

      <button class="danger" onclick="logout()">
        Desconectar
      </button>
    </div>
  </div>


  <!-- CRIAÇÃO -->
  <div class="card">

    <h2>✨ Criar</h2>

    <label for="mode">O que você quer criar?</label>

    <select id="mode" onchange="changeMode()">
      <option value="image">🖼️ Imagem</option>
      <option value="video">🎬 Vídeo</option>
      <option value="audio">🔊 Áudio</option>
      <option value="text">📝 Texto</option>
    </select>

    <br><br>

    <label for="prompt">Descreva sua ideia</label>

    <textarea
      id="prompt"
      placeholder="Digite aqui o que você quer que a IA crie..."
    ></textarea>

    <p class="small">
      Você pode escrever sua ideia do seu jeito. A IA tentará interpretar o pedido.
    </p>

    <!-- ARQUIVO -->
    <label class="file-button">
      📎 Escolher arquivo do celular
      <input
        type="file"
        id="fileInput"
        accept="image/*,video/*,audio/*,.txt,.md,.pdf"
        onchange="handleFile(event)"
      >
    </label>

    <div id="filePreview"></div>

    <br>

    <div class="row">

      <button class="primary" onclick="generate()">
        🚀 Criar com IA
      </button>

      <button class="secondary" onclick="clearAll()">
        🗑️ Limpar
      </button>

      <button
        id="regenerateButton"
        class="success hidden"
        onclick="generate()"
      >
        🔄 Gerar novamente
      </button>

    </div>

    <div id="status" class="status">
      Pronto para criar.
    </div>

  </div>


  <!-- RESULTADO -->
  <div class="card">

    <h2>🎨 Resultado</h2>

    <div id="result">

      <p class="small">
        O resultado da IA aparecerá aqui.
      </p>

    </div>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

/*
  COLOQUE AQUI A SUA MESMA PK_ DO POLLINATIONS.

  NÃO ENVIE A CHAVE PARA MIM.
*/
const CLIENT_ID = "pk_e3dlTjF2KpyiLMWx";

const API_BASE = "https://gen.pollinations.ai";
const AUTH_BASE = "https://enter.pollinations.ai";

const REDIRECT_URI =
  window.location.origin + window.location.pathname;

let accessToken = null;
let selectedFile = null;
let uploadedFileUrl = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const modeEl = document.getElementById("mode");
const promptEl = document.getElementById("prompt");
const fileInput = document.getElementById("fileInput");
const filePreview = document.getElementById("filePreview");
const resultEl = document.getElementById("result");
const statusEl = document.getElementById("status");
const regenerateButton =
  document.getElementById("regenerateButton");


/* =========================================================
   UTILITÁRIOS OAUTH
========================================================= */

function randomString(length = 64) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

  let result = "";

  const values = new Uint32Array(length);

  crypto.getRandomValues(values);

  for (let i = 0; i < length; i++) {
    result += chars[values[i] % chars.length];
  }

  return result;
}


function base64UrlEncode(buffer) {

  let binary = "";

  const bytes = new Uint8Array(buffer);

  for (const byte of bytes) {
    binary += String.fromCharCode(byte);
  }

  return btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}


async function createCodeChallenge(verifier) {

  const data =
    new TextEncoder().encode(verifier);

  const digest =
    await crypto.subtle.digest("SHA-256", data);

  return base64UrlEncode(digest);
}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

  if (
    !CLIENT_ID ||
    CLIENT_ID === "COLOQUE_SUA_PK_AQUI"
  ) {
    alert(
      "Coloque sua chave pk_ no código antes de conectar."
    );

    return;
  }

  const verifier =
    randomString(64);

  const challenge =
    await createCodeChallenge(verifier);

  sessionStorage.setItem(
    "pkce_verifier",
    verifier
  );

  const state =
    randomString(32);

  sessionStorage.setItem(
    "oauth_state",
    state
  );

  const params =
    new URLSearchParams({

      response_type: "code",

      client_id: CLIENT_ID,

      redirect_uri: REDIRECT_URI,

      scope: "profile usage",

      state: state,

      code_challenge: challenge,

      code_challenge_method: "S256"

    });

  window.location.href =
    AUTH_BASE +
    "/authorize?" +
    params.toString();
}


/* =========================================================
   CALLBACK OAUTH
========================================================= */

async function handleOAuthCallback() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  const state =
    params.get("state");

  if (!code) {
    updateLoginUI();
    return;
  }

  const savedState =
    sessionStorage.getItem(
      "oauth_state"
    );

  if (
    !state ||
    state !== savedState
  ) {

    alert(
      "Falha de segurança no login."
    );

    return;
  }

  const verifier =
    sessionStorage.getItem(
      "pkce_verifier"
    );

  if (!verifier) {

    alert(
      "Código de login não encontrado."
    );

    return;
  }

  setStatus(
    "🔐 Finalizando conexão..."
  );

  try {

    const response =
      await fetch(
        AUTH_BASE +
        "/api/oauth/token",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded"
          },

          body:
            new URLSearchParams({

              grant_type:
                "authorization_code",

              code: code,

              client_id:
                CLIENT_ID,

              redirect_uri:
                REDIRECT_URI,

              code_verifier:
                verifier

            })

        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.error ||
        "Falha na autenticação"
      );
    }

    accessToken =
      data.access_token;

    sessionStorage.setItem(
      "pollinations_access_token",
      accessToken
    );

    sessionStorage.removeItem(
      "pkce_verifier"
    );

    sessionStorage.removeItem(
      "oauth_state"
    );

    window.history.replaceState(
      {},
      document.title,
      REDIRECT_URI
    );

    updateLoginUI();

    setStatus(
      "✅ Conectado com sucesso!"
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Erro ao conectar: " +
      error.message
    );
  }
}


/* =========================================================
   INTERFACE LOGIN
========================================================= */

function updateLoginUI() {

  const loginArea =
    document.getElementById("loginArea");

  const connectedArea =
    document.getElementById("connectedArea");

  if (accessToken) {

    loginArea.classList.add(
      "hidden"
    );

    connectedArea.classList.remove(
      "hidden"
    );

  } else {

    loginArea.classList.remove(
      "hidden"
    );

    connectedArea.classList.add(
      "hidden"
    );
  }
}


function logout() {

  accessToken = null;

  sessionStorage.removeItem(
    "pollinations_access_token"
  );

  uploadedFileUrl = null;

  updateLoginUI();

  setStatus(
    "Você foi desconectado."
  );
}


/* =========================================================
   ARQUIVO DO CELULAR
========================================================= */

async function handleFile(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  selectedFile = file;

  uploadedFileUrl = null;

  filePreview.innerHTML = "";

  const box =
    document.createElement("div");

  box.className =
    "preview-box";

  const title =
    document.createElement("strong");

  title.textContent =
    "📎 " + file.name;

  box.appendChild(title);

  const info =
    document.createElement("div");

  info.className =
    "small";

  info.textContent =
    formatBytes(file.size) +
    " • " +
    (file.type || "arquivo");

  box.appendChild(info);


  /* IMAGEM */

  if (file.type.startsWith("image/")) {

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(file);

    box.appendChild(img);
  }


  /* VÍDEO */

  else if (
    file.type.startsWith("video/")
  ) {

    const video =
      document.createElement("video");

    video.src =
      URL.createObjectURL(file);

    video.controls = true;

    box.appendChild(video);
  }


  /* ÁUDIO */

  else if (
    file.type.startsWith("audio/")
  ) {

    const audio =
      document.createElement("audio");

    audio.src =
      URL.createObjectURL(file);

    audio.controls = true;

    box.appendChild(audio);
  }


  /* TEXTO */

  else if (
    file.type === "text/plain" ||
    file.name.endsWith(".md")
  ) {

    try {

      const text =
        await file.text();

      const preview =
        document.createElement("div");

      preview.className =
        "result-text";

      preview.style.marginTop =
        "10px";

      preview.textContent =
        text.substring(0, 2000);

      box.appendChild(preview);

    } catch (e) {}
  }


  filePreview.appendChild(box);

  setStatus(
    "📎 Arquivo selecionado. Ele será enviado quando você criar."
  );
}


/* =========================================================
   UPLOAD DO ARQUIVO
========================================================= */

async function uploadFile() {

  if (!selectedFile) {
    return null;
  }

  if (!accessToken) {

    throw new Error(
      "Conecte sua conta antes de enviar um arquivo."
    );
  }

  if (
    selectedFile.size >
    100 * 1024 * 1024
  ) {

    throw new Error(
      "O arquivo é maior que 100 MB."
    );
  }

  setStatus(
    "📤 Enviando " +
    selectedFile.name +
    "..."
  );

  const formData =
    new FormData();

  formData.append(
    "file",
    selectedFile
  );

  const response =
    await fetch(
      "https://media.pollinations.ai/upload",
      {

        method: "POST",

        headers: {
          Authorization:
            "Bearer " +
            accessToken
        },

        body: formData
      }
    );

  const data =
    await response.json();

  if (!response.ok) {

    throw new Error(
      data.error ||
      data.message ||
      "Não foi possível enviar o arquivo."
    );
  }

  uploadedFileUrl =
    data.url;

  setStatus(
    "✅ Arquivo enviado com sucesso!"
  );

  return uploadedFileUrl;
}


/* =========================================================
   CRIAÇÃO
========================================================= */

async function generate() {

  if (!accessToken) {

    alert(
      "Primeiro conecte sua conta Pollinations."
    );

    return;
  }

  const prompt =
    promptEl.value.trim();

  if (!prompt) {

    alert(
      "Digite o que você quer criar."
    );

    return;
  }

  resultEl.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <p>🤖 A IA está criando...</p>
    </div>
  `;

  regenerateButton.classList.add(
    "hidden"
  );

  try {

    /*
      Se houver arquivo, envia primeiro.
    */

    if (selectedFile) {
      await uploadFile();
    }

    const mode =
      modeEl.value;

    if (mode === "image") {

      await generateImage(prompt);

    } else if (mode === "video") {

      await generateVideo(prompt);

    } else if (mode === "audio") {

      await generateAudio(prompt);

    } else if (mode === "text") {

      await generateText(prompt);
    }

    regenerateButton.classList.remove(
      "hidden"
    );

    setStatus(
      "✅ Criação concluída!"
    );

  } catch (error) {

    console.error(error);

    resultEl.innerHTML = `
      <div class="status">
        ❌ Erro:<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    setStatus(
      "❌ Não foi possível concluir a criação."
    );
  }
}


/* =========================================================
   IMAGEM
========================================================= */

async function generateImage(prompt) {

  setStatus(
    "🖼️ Gerando imagem..."
  );

  const body = {

    model:
      "black-forest-labs/flux.1-schnell",

    prompt:
      prompt,

    n: 1,

    size:
      "1024x1024",

    response_format:
      "url"
  };


  /*
    Se o usuário enviou uma imagem,
    usa ela como referência.
  */

  if (
    uploadedFileUrl &&
    selectedFile &&
    selectedFile.type.startsWith("image/")
  ) {

    body.image =
      uploadedFileUrl;
  }


  const response =
    await fetch(
      API_BASE +
      "/v1/images/generations",
      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Authorization":
            "Bearer " +
            accessToken
        },

        body:
          JSON.stringify(body)
      }
    );

  const data =
    await response.json();

  if (!response.ok) {

    throw new Error(
      data.error?.message ||
      data.error ||
      "Erro na geração da imagem."
    );
  }

  const url =
    data.data?.[0]?.url;

  if (!url) {

    throw new Error(
      "A IA não retornou a imagem."
    );
  }

  resultEl.innerHTML = `
    <img
      src="${escapeAttribute(url)}"
      alt="Imagem criada pela IA"
    >

    <p>
      <a
        href="${escapeAttribute(url)}"
        target="_blank"
        style="color:#60a5fa"
      >
        🔗 Abrir imagem
      </a>
    </p>
  `;
}


/* =========================================================
   VÍDEO
========================================================= */

async function generateVideo(prompt) {

  setStatus(
    "🎬 Gerando vídeo..."
  );

  const params =
    new URLSearchParams();

  params.set(
    "model",
    "google/veo-3.1-fast"
  );

  params.set(
    "duration",
    "5"
  );

  /*
    Imagem enviada pelo celular
    pode ser usada como imagem inicial.
  */

  if (
    uploadedFileUrl &&
    selectedFile &&
    selectedFile.type.startsWith("image/")
  ) {

    params.set(
      "image",
      uploadedFileUrl
    );
  }

  params.set(
    "key",
    accessToken
  );

  const url =
    API_BASE +
    "/video/" +
    encodeURIComponent(prompt) +
    "?" +
    params.toString();

  const response =
    await fetch(url);

  if (!response.ok) {

    let message =
      "Erro na geração do vídeo.";

    try {

      const data =
        await response.json();

      message =
        data.error ||
        data.message ||
        message;

    } catch (e) {}

    throw new Error(message);
  }

  const blob =
    await response.blob();

  const videoUrl =
    URL.createObjectURL(blob);

  resultEl.innerHTML = `
    <video
      src="${videoUrl}"
      controls
      playsinline
    ></video>

    <p>
      <a
        href="${videoUrl}"
        target="_blank"
        style="color:#60a5fa"
      >
        🎬 Abrir vídeo
      </a>
    </p>
  `;
}


/* =========================================================
   ÁUDIO
========================================================= */

async function generateAudio(prompt) {

  setStatus(
    "🔊 Gerando áudio..."
  );

  const response =
    await fetch(
      API_BASE +
      "/v1/audio/speech",
      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Authorization":
            "Bearer " +
            accessToken
        },

        body:
          JSON.stringify({

            model:
              "tts-1",

            input:
              prompt,

            voice:
              "alloy",

            response_format:
              "mp3"
          })
      }
    );

  if (!response.ok) {

    let message =
      "Erro na geração do áudio.";

    try {

      const data =
        await response.json();

      message =
        data.error?.message ||
        data.error ||
        message;

    } catch (e) {}

    throw new Error(message);
  }

  const blob =
    await response.blob();

  const audioUrl =
    URL.createObjectURL(blob);

  resultEl.innerHTML = `
    <audio
      src="${audioUrl}"
      controls
      style="width:100%"
    ></audio>

    <p>
      <a
        href="${audioUrl}"
        download="audio-criador-ia.mp3"
        style="color:#60a5fa"
      >
        ⬇️ Baixar áudio
      </a>
    </p>
  `;
}


/* =========================================================
   TEXTO
========================================================= */

async function generateText(prompt) {

  setStatus(
    "📝 Criando texto..."
  );

  let finalPrompt =
    prompt;


  /*
    Se for arquivo de texto,
    coloca o conteúdo no pedido.
  */

  if (
    selectedFile &&
    (
      selectedFile.type === "text/plain" ||
      selectedFile.name.endsWith(".md")
    )
  ) {

    const fileText =
      await selectedFile.text();

    finalPrompt +=
      "\n\nConteúdo do arquivo enviado:\n" +
      fileText;
  }


  /*
    Se enviou outro tipo de arquivo,
    informa a URL para a IA.
  */

  if (
    uploadedFileUrl &&
    !(
      selectedFile &&
      (
        selectedFile.type === "text/plain" ||
        selectedFile.name.endsWith(".md")
      )
    )
  ) {

    finalPrompt +=
      "\n\nArquivo de referência enviado:\n" +
      uploadedFileUrl;
  }


  const response =
    await fetch(
      API_BASE +
      "/v1/chat/completions",
      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Authorization":
            "Bearer " +
            accessToken
        },

        body:
          JSON.stringify({

            model:
              "openai/gpt-5.4-nano",

            messages: [

              {
                role: "system",

                content:
                  "Você é o assistente de criação do aplicativo Criador IA. Entenda a ideia do usuário e produza um resultado claro, útil e bem escrito."
              },

              {
                role: "user",

                content:
                  finalPrompt
              }

            ]
          })
      }
    );

  const data =
    await response.json();

  if (!response.ok) {

    throw new Error(
      data.error?.message ||
      data.error ||
      "Erro na geração do texto."
    );
  }

  const text =
    data.choices?.[0]?.message?.content;

  if (!text) {

    throw new Error(
      "A IA não retornou texto."
    );
  }

  resultEl.innerHTML = `
    <div class="result-text">
      ${escapeHtml(text)}
    </div>
  `;
}


/* =========================================================
   MODO
========================================================= */

function changeMode() {

  const mode =
    modeEl.value;

  if (mode === "image") {

    promptEl.placeholder =
      "Ex: Crie uma imagem de um homem jogando Street Fighter 6 em um quarto gamer...";

  } else if (mode === "video") {

    promptEl.placeholder =
      "Ex: Um personagem caminhando por uma cidade futurista durante a noite...";

  } else if (mode === "audio") {

    promptEl.placeholder =
      "Digite o texto que você quer transformar em áudio...";

  } else {

    promptEl.placeholder =
      "Ex: Crie um roteiro para um vídeo sobre hipnose...";
  }
}

/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");
}


function escapeAttribute(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}


function formatBytes(bytes) {

  if (bytes === 0) {
    return "0 Bytes";
  }

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];

  const i =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    parseFloat(
      (bytes /
      Math.pow(1024, i))
      .toFixed(2)
    ) +
    " " +
    units[i]
  );
}
